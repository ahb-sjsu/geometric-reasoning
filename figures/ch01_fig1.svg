<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="The spectrum of search: the heuristic sets the place"><rect width="100%" height="100%" fill="#0b1622"/><text x="18" y="27" font-family="'Crimson Pro', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#e8ecf0">The spectrum of search: the heuristic sets the place</text><line x1="40.00" y1="66.00" x2="680.00" y2="66.00" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="680.00" y1="66.00" x2="673.14" y2="70.12" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="680.00" y1="66.00" x2="673.14" y2="61.88" stroke="#a9bccd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="40.00" y="54.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">h(x) = 0 for all x</text><text x="360.00" y="54.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e8ecf0" text-anchor="middle" font-weight="normal">quality of the heuristic h(x)</text><text x="680.00" y="54.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="end" font-weight="normal">h(x) = h*(x)</text><rect x="22.00" y="86.00" width="163.00" height="262.00" rx="6" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><rect x="22" y="86" width="163" height="4" rx="2" fill="#66c2a5"/><text x="34.00" y="114.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#e8ecf0" text-anchor="start" font-weight="600">Uninformed</text><text x="34.00" y="140.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">BFS, DFS</text><text x="34.00" y="157.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">no knowledge of which</text><text x="34.00" y="174.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">directions are promising;</text><text x="34.00" y="191.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">cost exponential in the</text><text x="34.00" y="208.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">depth of the solution</text><line x1="34.00" y1="262.00" x2="173.00" y2="262.00" stroke="#2a4a56" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><text x="34.00" y="282.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8fa4b8" text-anchor="start" font-weight="normal" font-style="italic">In reasoning</text><text x="34.00" y="302.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">guessing</text><rect x="193.00" y="86.00" width="163.00" height="262.00" rx="6" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><rect x="193" y="86" width="163" height="4" rx="2" fill="#fc8d62"/><text x="205.00" y="114.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#e8ecf0" text-anchor="start" font-weight="600">Greedy</text><text x="205.00" y="140.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">moves to the neighbour</text><text x="205.00" y="157.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">that minimises h(x);</text><text x="205.00" y="174.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">fast, easily misled,</text><text x="205.00" y="191.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">never looks back</text><line x1="205.00" y1="262.00" x2="344.00" y2="262.00" stroke="#2a4a56" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><text x="205.00" y="282.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8fa4b8" text-anchor="start" font-weight="normal" font-style="italic">In reasoning</text><text x="205.00" y="302.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">intuitive, impulsive</text><text x="205.00" y="319.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">reasoning</text><rect x="364.00" y="86.00" width="163.00" height="262.00" rx="6" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><rect x="364" y="86" width="163" height="4" rx="2" fill="#8da0cb"/><text x="376.00" y="114.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#e8ecf0" text-anchor="start" font-weight="600">Informed (A*)</text><text x="376.00" y="140.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">f(x) = g(x) + h(x)</text><text x="376.00" y="157.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">weighs the cost already</text><text x="376.00" y="174.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">paid against the cost</text><text x="376.00" y="191.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">estimated to remain</text><line x1="376.00" y1="262.00" x2="515.00" y2="262.00" stroke="#2a4a56" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><text x="376.00" y="282.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8fa4b8" text-anchor="start" font-weight="normal" font-style="italic">In reasoning</text><text x="376.00" y="302.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">expert reasoning:</text><text x="376.00" y="319.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">guided deliberation</text><rect x="535.00" y="86.00" width="163.00" height="262.00" rx="6" fill="#1a3248" fill-opacity="1.0" stroke="#2a4a56" stroke-width="1"/><rect x="535" y="86" width="163" height="4" rx="2" fill="#e78ac3"/><text x="547.00" y="114.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#e8ecf0" text-anchor="start" font-weight="600">Optimal</text><text x="547.00" y="140.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">guaranteed to find the</text><text x="547.00" y="157.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">best solution; with</text><text x="547.00" y="174.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">h = h*, A* expands only</text><text x="547.00" y="191.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#a9bccd" text-anchor="start" font-weight="normal">the optimal path</text><line x1="547.00" y1="262.00" x2="686.00" y2="262.00" stroke="#2a4a56" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><text x="547.00" y="282.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8fa4b8" text-anchor="start" font-weight="normal" font-style="italic">In reasoning</text><text x="547.00" y="302.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">perfect rationality:</text><text x="547.00" y="319.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e8ecf0" text-anchor="start" font-weight="normal">a benchmark</text><text x="16.00" y="388.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="start" font-weight="normal" font-style="italic">schematic of Section 1.3</text></svg>
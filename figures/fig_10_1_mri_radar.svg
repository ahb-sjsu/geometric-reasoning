<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 14px; font-weight: 600; fill: #333; }
      .subtitle { font-size: 10px; fill: #666; }
      .axis-label { font-size: 9px; fill: #444; font-weight: 500; }
      .tick { font-size: 8px; fill: #bbb; }
      .model-name { font-size: 10px; font-weight: 600; }
      .finding { font-size: 9px; fill: #555; }
    </style>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="title">Figure 10.1 — Model Robustness Index: Per-Perturbation Vulnerability Profiles</text>
  <text x="360" y="40" text-anchor="middle" class="subtitle">MRI = 1 − flip rate under perturbation. Higher = more robust. Each model has a unique shape — the "robustness fingerprint."</text>

  <!-- Left radar: Claude -->
  <g transform="translate(180, 270)">
    <text x="0" y="-185" text-anchor="middle" class="model-name" fill="#1b9e77">Claude Sonnet 4.6</text>

    <!-- 6 axes: framing, emotion, distractor, gender, order, cultural -->
    <!-- Grid rings -->
    <polygon points="0,-35 30.3,-17.5 30.3,17.5 0,35 -30.3,17.5 -30.3,-17.5" fill="none" stroke="#eee" stroke-width="0.5"/>
    <polygon points="0,-70 60.6,-35 60.6,35 0,70 -60.6,35 -60.6,-35" fill="none" stroke="#eee" stroke-width="0.5"/>
    <polygon points="0,-105 90.9,-52.5 90.9,52.5 0,105 -90.9,52.5 -90.9,-52.5" fill="none" stroke="#eee" stroke-width="0.5"/>
    <polygon points="0,-140 121.2,-70 121.2,70 0,140 -121.2,70 -121.2,-70" fill="none" stroke="#ddd" stroke-width="0.8"/>

    <!-- Axis lines -->
    <line x1="0" y1="0" x2="0" y2="-150" stroke="#ccc" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="129.9" y2="-75" stroke="#ccc" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="129.9" y2="75" stroke="#ccc" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="0" y2="150" stroke="#ccc" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-129.9" y2="75" stroke="#ccc" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-129.9" y2="-75" stroke="#ccc" stroke-width="0.5"/>

    <!-- Axis labels -->
    <text x="0" y="-155" text-anchor="middle" class="axis-label">Framing</text>
    <text x="140" y="-72" text-anchor="start" class="axis-label">Emotion</text>
    <text x="140" y="80" text-anchor="start" class="axis-label">Distractor</text>
    <text x="0" y="162" text-anchor="middle" class="axis-label">Gender</text>
    <text x="-140" y="80" text-anchor="end" class="axis-label">Order</text>
    <text x="-140" y="-72" text-anchor="end" class="axis-label">Cultural</text>

    <!-- Claude data: framing=0.63, emotion=0.49, distractor=0.65, gender=0.96, order=1.0, cultural=0.96 -->
    <polygon points="
      0,-88.2
      68.6,-34.3
      91,-52.5
      0,134.4
      -121.2,-70
      -116.4,-67.2
    " fill="rgba(27,158,119,0.2)" stroke="#1b9e77" stroke-width="2.5"/>

    <text x="0" y="178" text-anchor="middle" class="finding" fill="#1b9e77">Strong on invariance (gender, order)</text>
    <text x="0" y="190" text-anchor="middle" class="finding" fill="#d73027">Weak on emotional anchoring (0.49)</text>
  </g>

  <!-- Right radar: Flash 2.5 -->
  <g transform="translate(540, 270)">
    <text x="0" y="-185" text-anchor="middle" class="model-name" fill="#66a61e">Gemini 2.5 Flash</text>

    <!-- Grid rings -->
    <polygon points="0,-35 30.3,-17.5 30.3,17.5 0,35 -30.3,17.5 -30.3,-17.5" fill="none" stroke="#eee" stroke-width="0.5"/>
    <polygon points="0,-70 60.6,-35 60.6,35 0,70 -60.6,35 -60.6,-35" fill="none" stroke="#eee" stroke-width="0.5"/>
    <polygon points="0,-105 90.9,-52.5 90.9,52.5 0,105 -90.9,52.5 -90.9,-52.5" fill="none" stroke="#eee" stroke-width="0.5"/>
    <polygon points="0,-140 121.2,-70 121.2,70 0,140 -121.2,70 -121.2,-70" fill="none" stroke="#ddd" stroke-width="0.8"/>

    <!-- Axis lines -->
    <line x1="0" y1="0" x2="0" y2="-150" stroke="#ccc" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="129.9" y2="-75" stroke="#ccc" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="129.9" y2="75" stroke="#ccc" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="0" y2="150" stroke="#ccc" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-129.9" y2="75" stroke="#ccc" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-129.9" y2="-75" stroke="#ccc" stroke-width="0.5"/>

    <!-- Labels -->
    <text x="0" y="-155" text-anchor="middle" class="axis-label">Framing</text>
    <text x="140" y="-72" text-anchor="start" class="axis-label">Emotion</text>
    <text x="140" y="80" text-anchor="start" class="axis-label">Distractor</text>
    <text x="0" y="162" text-anchor="middle" class="axis-label">Gender</text>
    <text x="-140" y="80" text-anchor="end" class="axis-label">Order</text>
    <text x="-140" y="-72" text-anchor="end" class="axis-label">Cultural</text>

    <!-- Flash 2.5 data: framing=0.52, emotion=0.55, distractor=0.72, gender=0.71, order=0.87, cultural=0.71 -->
    <polygon points="
      0,-72.8
      77,-38.5
      100.8,50.4
      0,121.8
      -105.5,60.9
      -96.4,-55.7
    " fill="rgba(102,166,30,0.2)" stroke="#66a61e" stroke-width="2.5"/>

    <text x="0" y="178" text-anchor="middle" class="finding" fill="#66a61e">More uniform shape (no extremes)</text>
    <text x="0" y="190" text-anchor="middle" class="finding" fill="#d73027">But uniformly mediocre (all 0.5–0.7)</text>
  </g>

  <!-- Center comparison -->
  <g transform="translate(290, 410)">
    <rect x="0" y="0" width="140" height="50" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="5"/>
    <text x="70" y="18" text-anchor="middle" class="axis-label" font-weight="700">Key Insight</text>
    <text x="70" y="32" text-anchor="middle" class="finding">Same composite MRI ≈ 0.75</text>
    <text x="70" y="44" text-anchor="middle" class="finding" fill="#d73027" font-weight="600">Completely different shapes</text>
  </g>

  <!-- Caption -->
  <text x="360" y="470" text-anchor="middle" class="subtitle">The MRI radar reveals vulnerability structure that composite scores destroy. Claude's spike on invariance + dip on emotion ≠ Flash 2.5's uniform profile.</text>
</svg>
